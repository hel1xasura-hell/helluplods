[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pyflakes (unused/undefined names, etc.) and syntax errors only; style nits are not worth failing CI over.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401", "F403"]
"tests/conftest.py" = ["F401"]
