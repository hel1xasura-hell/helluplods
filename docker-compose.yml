services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hell
      POSTGRES_PASSWORD: hell
      POSTGRES_DB: hell_uploads
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hell -d hell_uploads"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hell:hell@postgres:5432/hell_uploads
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    stop_grace_period: 20s
  worker-default:
    build: {context: ., dockerfile: workers/Dockerfile.default}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hell:hell@postgres:5432/hell_uploads
      REDIS_URL: redis://redis:6379/0
    depends_on: [api, redis]
  worker-browser:
    build: {context: ., dockerfile: workers/Dockerfile.browser}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hell:hell@postgres:5432/hell_uploads
      REDIS_URL: redis://redis:6379/0
    depends_on: [api, redis]
    shm_size: 1gb
  worker-render:
    build: {context: ., dockerfile: workers/Dockerfile.render}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hell:hell@postgres:5432/hell_uploads
      REDIS_URL: redis://redis:6379/0
    depends_on: [api, redis]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  pgdata:
