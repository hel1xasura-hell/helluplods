name: CI
on:
  push: {branches: [main]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  backend-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: hell, POSTGRES_PASSWORD: hell, POSTGRES_DB: hell_uploads}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hell" --health-interval 5s --health-retries 10
    defaults: {run: {working-directory: backend}}
    env:
      DATABASE_URL: postgresql+psycopg://hell:hell@localhost:5432/hell_uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # There is no package-lock.json in this repo yet, so the cache key is built from package.json (which exists).
        # Once a lockfile is committed (run `npm install` in frontend/ and commit package-lock.json), change this to
        # `cache-dependency-path: frontend/package-lock.json` and replace `npm install` below with `npm ci`.
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package.json}
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright pytest
      - run: playwright install --with-deps chromium
      # `sh` instead of ./ : files added through the GitHub web upload lose their executable bit (Permission denied)
      - run: sh scripts/sync_companion.sh && git diff --exit-code desktop/companion/vendor
      - run: pytest -q desktop/tests
      
